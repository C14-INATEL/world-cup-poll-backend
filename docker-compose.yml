volumes:
  db_data:

services:
  backend:
    build:
      context: .
    container_name: world-cup-poll-backend
    restart: always
    environment:
      PORT: ${PORT:-3333}
      FRONTEND_URL: ${FRONTEND_URL}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:example@db:5432/database}
    ports:
      - "${PORT:-3333}:${PORT:-3333}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:${PORT:-3333}/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      start_period: 20s
      interval: 10s
      timeout: 10s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16.9-alpine3.22
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_DB: ${POSTGRES_DB:-database}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-database}"]
      interval: 60s
      timeout: 5s
      retries: 5
