volumes:
  jenkins_home:
  db_data:

networks:
  world-cup-poll-network:
    external: true

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 100m
    networks:
      - world-cup-poll-network

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
      args:
        DOCKER_GID: ${DOCKER_GID:-988}
    container_name: jenkins
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/ubuntu/projeto-c14:/home/ubuntu/projeto-c14:ro
    networks:
      - world-cup-poll-network

  backend:
    image: joaolucenalima/world-cup-poll-backend:latest
    container_name: world-cup-poll-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:?PORT is required}
      FRONTEND_URL: ${FRONTEND_URL}
      FOOTBALL_API_KEY: ${FOOTBALL_API_KEY:?FOOTBALL_API_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    expose:
      - "${PORT:?PORT is required}"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 300m
    networks:
      - world-cup-poll-network

  db:
    image: postgres:16.9-alpine3.22
    container_name: world-cup-poll-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 400m
    networks:
      - world-cup-poll-network